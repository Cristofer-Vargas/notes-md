name: Build, Test & Auto-Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-release:
    name: Validar, Compilar e Publicar Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout do repositório (histórico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        env:
          HUSKY: '0'
        run: npm ci

      - name: Verificar tipos (TypeScript)
        run: npm run typecheck

      - name: Executar testes automatizados (Vitest)
        run: npm test

      - name: Versionar, compilar instalador e publicar Release (Semantic Release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HUSKY: '0'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
